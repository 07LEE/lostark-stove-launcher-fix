name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "패키지 버전 (예: 1.0.1)"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh "${{ steps.ver.outputs.version }}"

      - name: Verify package
        run: |
          set -euo pipefail
          deb="dist/lostark-stove-launcher-fix_${{ steps.ver.outputs.version }}_all.deb"
          mkdir -p /tmp/pkg
          dpkg-deb -x "$deb" /tmp/pkg
          cmp /tmp/pkg/usr/bin/stove-launcher-fix stove-launcher.sh
          bash -n /tmp/pkg/usr/bin/stove-launcher-fix
          sudo apt-get install -y -qq desktop-file-utils >/dev/null
          desktop-file-validate /tmp/pkg/usr/share/applications/*.desktop
          echo "package OK"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: dist/lostark-stove-launcher-fix_${{ steps.ver.outputs.version }}_all.deb
          generate_release_notes: true
